name: Release

# Builds the Windows package and publishes it as a GitHub release.
# Automatic on a tag like v0.2.0, or by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, zum Beispiel 0.2.1'
        required: true
      prerelease:
        description: 'Als Vorabversion veröffentlichen'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # FFmpeg is needed for the tests and is shipped inside the package.
      - name: FFmpeg bereitstellen
        run: choco install ffmpeg -y --no-progress

      - name: vpk installieren
        run: dotnet tool install -g vpk

      - name: Version bestimmen
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'push') {
            '${{ github.ref_name }}'.TrimStart('v')
          } else {
            '${{ inputs.version }}'
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Unerwartete Version: $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      # A local run with -Publish creates the tag, which starts this workflow. Without this
      # check the run would upload the same assets into the finished release a second time.
      - name: Vorhandenes Release prüfen
        id: existing
        shell: pwsh
        run: |
          $tag = 'v${{ steps.version.outputs.value }}'
          # The release API returns a stale asset list for minutes after publishing; the download
          # URL of the update feed is current, and it only exists once a release is complete.
          $feed = '${{ github.server_url }}/${{ github.repository }}/releases/download/' + $tag + '/releases.win.json'
          try { Invoke-WebRequest -Uri $feed -Method Head -ErrorAction Stop | Out-Null; $done = $true }
          catch { $done = $false }
          if ($done) { Write-Host "Release $tag ist bereits vollständig; es wird nur gebaut." }
          "publish=$(-not $done)".ToLowerInvariant() >> $env:GITHUB_OUTPUT

      - name: Bauen, testen, paketieren und veröffentlichen
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $arguments = @{
            Version = '${{ steps.version.outputs.value }}'
            RepoUrl = '${{ github.server_url }}/${{ github.repository }}'
            Token   = $env:GITHUB_TOKEN
            # PATH only holds Chocolatey shims, which do not work once copied into the package.
            FfmpegDirectory = "$env:ChocolateyInstall\lib\ffmpeg\tools\ffmpeg\bin"
          }
          if ('${{ steps.existing.outputs.publish }}' -eq 'true') {
            $arguments.Publish = $true
            $arguments.Merge = $true
          }
          if ('${{ inputs.prerelease }}' -eq 'true') { $arguments.Prerelease = $true }
          ./src/release.ps1 @arguments

      - name: Paket als Artefakt sichern
        uses: actions/upload-artifact@v7
        with:
          name: velopack-${{ steps.version.outputs.value }}
          path: output/velopack
          retention-days: 14
